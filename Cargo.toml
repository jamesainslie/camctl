[workspace]
resolver = "3"
members = ["crates/uvc", "crates/usb", "crates/cli", "crates/capture", "crates/core", "crates/app", "xtask"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jamesainslie/camctl"

[workspace.dependencies]
camctl-uvc = { path = "crates/uvc" }
camctl-usb = { path = "crates/usb" }
camctl-core = { path = "crates/core" }
camctl-capture = { path = "crates/capture" }
thiserror = "2"

# Warnings fail CI: `cargo xtask ci` runs Clippy and rustdoc with -D warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Every unsafe block says why it is sound, and only unsafe blocks carry
# SAFETY comments.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
# No unwrap or panic in shipped code (tests may; see clippy.toml). An
# `expect` must name the invariant it relies on.
unwrap_used = "warn"
panic = "warn"
# No leftovers.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Errors are handled or explicitly discarded, never dropped with `.ok();`.
unused_result_ok = "warn"
# Suppressions use #[expect(..., reason = "...")], so a stale one fails.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
