[workspace]
resolver = "3"
members = ["crates/uvc", "crates/usb", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/jamesainslie/camctl"

[workspace.dependencies]
camctl-uvc = { path = "crates/uvc" }
camctl-usb = { path = "crates/usb" }
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
