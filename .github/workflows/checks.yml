name: checks

# Every job runs a `cargo xtask` task, so each check can be run locally
# exactly as CI runs it. `cargo xtask ci` runs them all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    # Weekly, so advisories against unchanged dependencies still surface.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Backtraces for panics only, not for every xtask error.
  RUST_LIB_BACKTRACE: "0"

jobs:
  lint:
    name: lint (format, rules, workflows, scripts, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: cargo xtask lint
        run: cargo xtask lint

  changelog:
    name: changelog updated
    # Every PR that changes behaviour says so under ## [Unreleased]. Label a
    # PR skip-changelog when it changes nothing user-visible.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
          save-if: false
      - name: Check CHANGELOG.md
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask changelog-check --base "origin/$BASE_REF"

  check:
    name: clippy, rustdoc, tests, smoke (macOS)
    # The app and the capture code are macOS-only, so they build where they
    # run. Waiting for lint keeps a formatting slip from spending macOS
    # minutes.
    needs: lint
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo xtask check
        run: cargo xtask check
      - name: Verify no tracked files changed
        run: |
          set -euo pipefail
          git update-index -q --refresh
          if [ -n "$(git status --porcelain --ignore-submodules)" ]; then
            echo "::error::the checks changed tracked files (Cargo.lock?)"
            git status --porcelain=v1 --ignore-submodules
            git --no-pager diff
            exit 1
          fi

  # The one check to require in branch protection: it fails if any job
  # above failed or was cancelled, and passes when a job was skipped on
  # purpose (the changelog check outside PRs, the macOS job on schedule).
  checks:
    name: checks passed
    if: always()
    needs: [lint, changelog, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a required job finished as $result"
                exit 1
                ;;
            esac
          done
