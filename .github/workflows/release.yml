name: release

# Tags are made by `cargo xtask tag` after a release PR (from
# `cargo xtask release`) has merged. See docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Backtraces for panics only, not for every xtask error.
  RUST_LIB_BACKTRACE: "0"

jobs:
  release:
    name: build and publish the release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release and upload its assets
    env:
      # The Homebrew tap is updated only when this secret exists: a token
      # that can push to yaklabco/homebrew-tap.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      # A release is Developer ID signed and notarized, or it is not made:
      # an ad-hoc build is blocked by Gatekeeper and loses its camera
      # permission on every update.
      - name: Require the signing and notarization secrets
        env:
          HAS_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD != '' }}
          HAS_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=0
          for pair in \
            "HAS_P12 APPLE_DEVELOPER_ID_P12" \
            "HAS_P12_PASSWORD APPLE_DEVELOPER_ID_PASSWORD" \
            "HAS_IDENTITY APPLE_DEVELOPER_ID_IDENTITY" \
            "HAS_APPLE_ID APPLE_ID" \
            "HAS_TEAM_ID APPLE_TEAM_ID" \
            "HAS_APP_PASSWORD APPLE_APP_PASSWORD"; do
            read -r flag secret <<<"$pair"
            if [ "${!flag}" != "true" ]; then
              echo "::error::the $secret secret is not set; see docs/RELEASING.md"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # No build cache: a release builds from the tagged sources alone.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install the tools pinned in mise.toml
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Verify the tag matches Cargo.toml and CHANGELOG.md
        run: cargo xtask verify-tag "$GITHUB_REF_NAME"

      - name: cargo xtask ci
        run: cargo xtask ci

      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "CAMCTL_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the app, and build the CLI
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: cargo xtask dist

      # Nothing is published unless the app is what users must get.
      - name: Verify the app is signed, notarized and accepted by Gatekeeper
        run: scripts/verify-signed.sh dist/camctl.app

      - name: Write the release notes from CHANGELOG.md
        run: cargo xtask notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "camctl $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            dist/camctl-"$version"-macos-*.zip \
            dist/camctl-cli-"$version"-macos-*.tar.gz \
            dist/SHA256SUMS

      - name: Note that the Homebrew tap is not updated
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::notice::HOMEBREW_TAP_TOKEN is not set; yaklabco/homebrew-tap was not updated"

      # The tap is public: clone and render without the token, which only
      # the push step sees.
      - name: Write the Homebrew cask and formula
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone https://github.com/yaklabco/homebrew-tap.git "$tap"
          cargo xtask homebrew --tap "$tap" --sums dist/SHA256SUMS
          ruby -c "$tap/Casks/camctl.rb" "$tap/Formula/camctl-cli.rb"

      - name: Push the cask and formula to yaklabco/homebrew-tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/homebrew-tap"
          git add Casks/camctl.rb Formula/camctl-cli.rb
          if git diff --cached --quiet; then
            echo "the tap already has camctl $version"
            exit 0
          fi
          # Set on the clone, so a rebase below can commit as well.
          git config user.name "YakLabs"
          git config user.email "official@yaklab.org"
          git commit -m "chore(brew): update camctl to v$version"
          gh auth setup-git
          # Other repositories push to the tap too: rebase onto theirs.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push $attempt rejected; rebasing onto the tap's main"
            git pull --rebase origin main
          done
          echo "::error::could not push to yaklabco/homebrew-tap"
          exit 1
